repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1500"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: ["--fix"]
        exclude: ^eval/spider/
      - id: ruff-format
        exclude: ^eval/spider/
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: mypy datasleuth
        language: system
        pass_filenames: false
        types: [python]
      - id: frontend-typecheck
        name: tsc
        entry: bash -c 'cd frontend && npx tsc --noEmit'
        language: system
        pass_filenames: false
        files: ^frontend/src/
