server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 210m;   # uploads up to 200 MB

  location /sessions/ { proxy_pass http://api:8000; proxy_buffering off; proxy_read_timeout 300s; }
  location /traces/   { proxy_pass http://api:8000; }
  location / { try_files $uri /index.html; }
}
